<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pets - PetPaw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0ea5e9',secondary:'#10b981'}}}}</script>
  <style>.gradient-bg{background:linear-gradient(135deg,#0ea5e9 0%,#10b981 100%);}</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a href="/" class="flex items-center space-x-2">
          <div class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center"><i class="fas fa-paw text-white text-xl"></i></div>
          <span class="text-2xl font-bold bg-gradient-to-r from-sky-500 to-emerald-500 bg-clip-text text-transparent">PetPaw</span>
        </a>
        <div class="hidden md:flex items-center space-x-8">
          <a href="/" class="text-gray-600 hover:text-sky-500">Home</a>
          <a href="/services" class="text-gray-600 hover:text-sky-500">Services</a>
          <a href="/shop" class="text-gray-600 hover:text-sky-500">Shop</a>
          <a href="/vet-discount" class="text-gray-600 hover:text-sky-500">Vet Discount</a>
          <a href="/blog" class="text-gray-600 hover:text-sky-500">Blog</a>
        </div>
        <div class="flex items-center space-x-4" id="nav-auth"></div>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900"><i class="fas fa-dog text-primary mr-2"></i>My Pets</h1>
      <button onclick="showAddPetModal()" class="gradient-bg text-white px-6 py-3 rounded-full font-semibold hover:opacity-90 transition">
        <i class="fas fa-plus mr-2"></i>Add Pet
      </button>
    </div>

    <div id="pets-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="text-center text-gray-400 py-20 col-span-3">Loading pets...</div>
    </div>
  </div>

  <!-- Add/Edit Pet Modal -->
  <div id="petModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold mb-4" id="petModalTitle"><i class="fas fa-paw text-primary mr-2"></i>Add Pet</h3>
      <form id="petForm" onsubmit="savePet(event)">
        <input type="hidden" id="pet-id">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pet Name *</label>
            <input type="text" id="pet-name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Species *</label>
            <select id="pet-species" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
              <option value="">Select species</option>
              <option value="Dog">Dog</option>
              <option value="Cat">Cat</option>
              <option value="Bird">Bird</option>
              <option value="Rabbit">Rabbit</option>
              <option value="Fish">Fish</option>
              <option value="Hamster">Hamster</option>
              <option value="Reptile">Reptile</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Breed</label>
              <input type="text" id="pet-breed" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
              <select id="pet-gender" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
                <option value="">Select</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Birth Date</label>
              <input type="date" id="pet-birth_date" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Weight (kg)</label>
              <input type="text" id="pet-weight" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
              <input type="text" id="pet-color" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Microchip ID</label>
              <input type="text" id="pet-microchip" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
            <textarea id="pet-notes" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary"></textarea>
          </div>
        </div>
        <div class="flex space-x-3 mt-6">
          <button type="submit" class="flex-1 gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90">Save</button>
          <button type="button" onclick="closePetModal()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    let pets = [];
    const token = localStorage.getItem('token');

    document.addEventListener('DOMContentLoaded', () => {
      checkLoginStatus();
      loadPets();
    });

    async function loadPets() {
      if (!token) { window.location.href = '/login'; return; }
      try {
        const res = await fetch('/api/pets', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        pets = data.data || [];
        renderPets();
      } catch (e) { showError('Failed to load pets'); }
    }

    function renderPets() {
      const container = document.getElementById('pets-container');
      if (pets.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-20 col-span-3"><i class="fas fa-paw text-6xl mb-4"></i><p class="text-lg">No pets yet. Add your first pet!</p></div>';
        return;
      }
      container.innerHTML = pets.map(pet => {
        const age = pet.birth_date ? calculateAge(pet.birth_date) : 'Unknown';
        const icon = pet.species === 'Dog' ? 'fa-dog' : pet.species === 'Cat' ? 'fa-cat' : 'fa-paw';
        return '<div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition"><div class="gradient-bg p-6 text-white text-center"><div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fas '+icon+' text-3xl"></i></div><h3 class="text-xl font-bold">'+pet.name+'</h3><p class="opacity-80">'+pet.species+(pet.breed ? ' - '+pet.breed : '')+'</p></div><div class="p-4"><div class="space-y-2 text-sm text-gray-600 mb-4">'+ (pet.gender ? '<div><i class="fas fa-venus-mars mr-2 w-4"></i>'+pet.gender+'</div>' : '') + (age ? '<div><i class="fas fa-birthday-cake mr-2 w-4"></i>'+age+'</div>' : '') + (pet.weight ? '<div><i class="fas fa-weight mr-2 w-4"></i>'+pet.weight+' kg</div>' : '') + (pet.microchip ? '<div><i class="fas fa-microchip mr-2 w-4"></i>'+pet.microchip+'</div>' : '') +'</div><div class="flex space-x-2"><button onclick="editPet('+pet.id+')" class="flex-1 bg-sky-100 text-sky-600 py-2 rounded-lg text-sm font-medium hover:bg-sky-200"><i class="fas fa-edit mr-1"></i>Edit</button><button onclick="deletePet('+pet.id+')" class="flex-1 bg-red-100 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-200"><i class="fas fa-trash mr-1"></i>Delete</button></div></div></div>';
      }).join('');
    }

    function calculateAge(birthDate) {
      const birth = new Date(birthDate);
      const now = new Date();
      const years = now.getFullYear() - birth.getFullYear();
      const months = now.getMonth() - birth.getMonth();
      if (years < 1) return months + ' months';
      return years + ' year' + (years > 1 ? 's' : '');
    }

    function showAddPetModal() {
      document.getElementById('petModalTitle').innerHTML = '<i class="fas fa-paw text-primary mr-2"></i>Add Pet';
      document.getElementById('pet-id').value = '';
      document.getElementById('petForm').reset();
      document.getElementById('petModal').classList.remove('hidden');
    }

    function editPet(id) {
      const pet = pets.find(p => p.id === id);
      if (!pet) return;
      document.getElementById('petModalTitle').innerHTML = '<i class="fas fa-edit text-primary mr-2"></i>Edit Pet';
      document.getElementById('pet-id').value = pet.id;
      document.getElementById('pet-name').value = pet.name || '';
      document.getElementById('pet-species').value = pet.species || '';
      document.getElementById('pet-breed').value = pet.breed || '';
      document.getElementById('pet-gender').value = pet.gender || '';
      document.getElementById('pet-birth_date').value = pet.birth_date || '';
      document.getElementById('pet-weight').value = pet.weight || '';
      document.getElementById('pet-color').value = pet.color || '';
      document.getElementById('pet-microchip').value = pet.microchip || '';
      document.getElementById('pet-notes').value = pet.notes || '';
      document.getElementById('petModal').classList.remove('hidden');
    }

    function closePetModal() {
      document.getElementById('petModal').classList.add('hidden');
    }

    async function savePet(e) {
      e.preventDefault();
      const id = document.getElementById('pet-id').value;
      const data = {
        name: document.getElementById('pet-name').value,
        species: document.getElementById('pet-species').value,
        breed: document.getElementById('pet-breed').value,
        gender: document.getElementById('pet-gender').value,
        birth_date: document.getElementById('pet-birth_date').value,
        weight: document.getElementById('pet-weight').value,
        color: document.getElementById('pet-color').value,
        microchip: document.getElementById('pet-microchip').value,
        notes: document.getElementById('pet-notes').value
      };
      try {
        const url = id ? '/api/pets/' + id : '/api/pets';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) {
          closePetModal();
          loadPets();
        } else { alert(result.message || 'Failed to save pet'); }
      } catch (e) { alert('Failed to save pet'); }
    }

    async function deletePet(id) {
      if (!confirm('Are you sure you want to remove this pet?')) return;
      try {
        const res = await fetch('/api/pets/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
        const result = await res.json();
        if (result.success) loadPets();
        else alert(result.message);
      } catch (e) { alert('Failed to delete pet'); }
    }
  </script>
</body>
</html>

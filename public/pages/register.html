<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PetPaw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0ea5e9',secondary:'#10b981'},fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    body{font-family:'Inter',sans-serif;background:#f8fafc}
    .gradient-bg{background:linear-gradient(135deg,#0ea5e9 0%,#10b981 100%)}
    .gradient-text{background:linear-gradient(135deg,#0ea5e9,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .step-dot{transition:all .3s}.step-dot.active{background:#0ea5e9;color:white;transform:scale(1.15)}
    .step-dot.done{background:#10b981;color:white}.step-dot.inactive{background:#e2e8f0;color:#94a3b8}
  </style>
</head>
<body class="min-h-screen">

  <nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <div class="w-9 h-9 gradient-bg rounded-lg flex items-center justify-center"><i class="fas fa-paw text-white"></i></div>
        <span class="text-xl font-bold gradient-text">PetPaw</span>
      </a>
      <a href="/login" class="text-gray-500 text-sm hover:text-sky-500">Already a member? Sign in</a>
    </div>
  </nav>

  <div class="max-w-3xl mx-auto px-4 py-10">

    <!-- Steps -->
    <div class="flex items-center justify-center mb-8">
      <div class="flex items-center gap-2">
        <div id="dot1" class="step-dot active w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">1</div>
        <div class="w-10 h-0.5 bg-gray-200" id="line1"></div>
        <div id="dot2" class="step-dot inactive w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">2</div>
        <div class="w-10 h-0.5 bg-gray-200" id="line2"></div>
        <div id="dot3" class="step-dot inactive w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">3</div>
      </div>
    </div>
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900" id="step-title">Your Information</h1>
      <p class="text-gray-400 text-sm mt-1" id="step-desc">Let's get to know you and your pets</p>
    </div>

    <!-- Error -->
    <div id="err" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 mb-4 text-sm flex items-center gap-2">
      <i class="fas fa-exclamation-circle"></i><span id="err-text"></span>
    </div>

    <!-- STEP 1: Personal Info -->
    <div id="step1" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">First Name <span class="text-red-500">*</span></label>
          <input type="text" id="first_name" placeholder="John"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Last Name <span class="text-red-500">*</span></label>
          <input type="text" id="last_name" placeholder="Doe"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Email <span class="text-red-500">*</span></label>
        <input type="email" id="email" placeholder="your@email.com"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Phone <span class="text-red-500">*</span></label>
        <input type="tel" id="phone" placeholder="(555) 123-4567"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Address <span class="text-red-500">*</span></label>
        <input type="text" id="address" placeholder="123 Main Street"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">City <span class="text-red-500">*</span></label>
          <input type="text" id="city" placeholder="New York"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Zip Code <span class="text-red-500">*</span></label>
          <input type="text" id="zip" placeholder="10001"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
      </div>
      <div class="flex justify-end pt-4">
        <button onclick="step1Next()" class="gradient-bg text-white px-8 py-3 rounded-xl font-semibold text-sm hover:opacity-90">
          Next <i class="fas fa-arrow-right ml-1"></i>
        </button>
      </div>
    </div>

    <!-- STEP 2: Pet Info -->
    <div id="step2" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
      <div class="mb-6">
        <h3 class="font-bold text-gray-900 mb-4">Add Your Pets</h3>
        <div id="pets-list" class="space-y-4 mb-4">
          <!-- Pets added here -->
        </div>
        <button onclick="addPetForm()" class="w-full border-2 border-dashed border-gray-300 rounded-xl py-3 text-gray-600 hover:border-sky-500 hover:text-sky-500 transition text-sm font-medium">
          <i class="fas fa-plus mr-1"></i> Add Another Pet
        </button>
      </div>
      <div id="pet-form" class="hidden bg-gray-50 rounded-xl p-4 space-y-3 mb-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Pet Name <span class="text-red-500">*</span></label>
            <input type="text" id="pet_name" placeholder="Buddy"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Type <span class="text-red-500">*</span></label>
            <select id="pet_type" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="">Select type</option>
              <option value="Dog">🐕 Dog</option>
              <option value="Cat">🐈 Cat</option>
              <option value="Bird">🦜 Bird</option>
              <option value="Rabbit">🐇 Rabbit</option>
              <option value="Other">🐾 Other</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Breed</label>
            <input type="text" id="pet_breed" placeholder="Golden Retriever"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Age (years)</label>
            <input type="number" id="pet_age" placeholder="3" min="0" step="0.5"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Gender</label>
            <select id="pet_gender" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Neutered/Spayed</label>
            <select id="pet_neutered" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="">Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="savePet()" class="flex-1 gradient-bg text-white py-2 rounded-lg text-sm font-semibold hover:opacity-90">
            Save Pet
          </button>
          <button onclick="cancelPet()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">
            Cancel
          </button>
        </div>
      </div>
      <div class="flex justify-between pt-4">
        <button onclick="setStep(1)" class="text-gray-400 hover:text-gray-600 text-sm font-medium">
          <i class="fas fa-arrow-left mr-1"></i> Back
        </button>
        <button onclick="step2Next()" class="gradient-bg text-white px-8 py-3 rounded-xl font-semibold text-sm hover:opacity-90">
          Next <i class="fas fa-arrow-right ml-1"></i>
        </button>
      </div>
    </div>

    <!-- STEP 3: Account & Plans -->
    <div id="step3" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 p-6 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Username <span class="text-red-500">*</span></label>
          <input type="text" id="username" placeholder="Choose username"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Password <span class="text-red-500">*</span></label>
          <input type="password" id="password" placeholder="Min 6 characters"
            class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Referral Code (optional)</label>
        <input type="text" id="invite_code" placeholder="Friend's code"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      <div class="border-t border-gray-100 pt-4">
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-3">Choose a Plan (optional)</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center gap-3 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-sky-500 transition">
            <input type="radio" name="plan" value="vet" class="w-4 h-4">
            <div>
              <div class="font-semibold text-gray-800 text-sm">Vet Discount</div>
              <div class="text-gray-400 text-xs">25% off at vets</div>
            </div>
          </label>
          <label class="flex items-center gap-3 p-3 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-emerald-500 transition">
            <input type="radio" name="plan" value="wellness" class="w-4 h-4">
            <div>
              <div class="font-semibold text-gray-800 text-sm">Wellness</div>
              <div class="text-gray-400 text-xs">Reimbursement</div>
            </div>
          </label>
        </div>
      </div>
      <div class="bg-emerald-50 rounded-xl p-3 flex items-start gap-2 text-xs text-emerald-700">
        <i class="fas fa-shield-alt mt-0.5"></i>
        <span>30-day risk-free. No claims? Full refund.</span>
      </div>
      <div class="flex justify-between pt-4">
        <button onclick="setStep(2)" class="text-gray-400 hover:text-gray-600 text-sm font-medium">
          <i class="fas fa-arrow-left mr-1"></i> Back
        </button>
        <button onclick="submitReg()" id="submit-btn" class="gradient-bg text-white px-8 py-3 rounded-xl font-semibold text-sm hover:opacity-90">
          <i class="fas fa-lock mr-1"></i> Complete Registration
        </button>
      </div>
    </div>

    <!-- Success -->
    <div id="success" class="hidden text-center py-10">
      <div class="w-20 h-20 gradient-bg rounded-full flex items-center justify-center mx-auto mb-5">
        <i class="fas fa-check text-white text-3xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Welcome to PetPaw!</h2>
      <p class="text-gray-500 mb-8">Your account is ready. Let's get started!</p>
      <a href="/profile" class="gradient-bg text-white px-8 py-3 rounded-xl font-semibold hover:opacity-90 inline-block">
        Go to My Account <i class="fas fa-arrow-right ml-2"></i>
      </a>
    </div>

  </div>

<script>
const API = 'https://pet365-store.onrender.com';
let fd = {}, pets = [];

function showErr(msg) {
  document.getElementById('err').classList.remove('hidden');
  document.getElementById('err-text').textContent = msg;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function hideErr() { document.getElementById('err').classList.add('hidden'); }

function setStep(n) {
  [1,2,3].forEach(s => {
    document.getElementById('step'+s).classList.add('hidden');
    document.getElementById('dot'+s).className = 'step-dot inactive w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold';
  });
  document.getElementById('step'+n).classList.remove('hidden');
  document.getElementById('dot'+n).className = 'step-dot active w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold';
  for (let s = 1; s < n; s++) {
    document.getElementById('dot'+s).className = 'step-dot done w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold';
    const line = document.getElementById('line'+s);
    if (line) line.style.background = '#10b981';
  }
  const titles = ['', 'Your Information', 'Your Pets', 'Account & Plan'];
  const descs = ['', 'Tell us about yourself', 'Add your beloved pets', 'Create account & choose plan'];
  document.getElementById('step-title').textContent = titles[n];
  document.getElementById('step-desc').textContent = descs[n];
}

function step1Next() {
  const fn = document.getElementById('first_name').value.trim();
  const ln = document.getElementById('last_name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const addr = document.getElementById('address').value.trim();
  const city = document.getElementById('city').value.trim();
  const zip = document.getElementById('zip').value.trim();
  if (!fn || !ln || !email || !phone || !addr || !city || !zip) {
    showErr('Please fill in all required fields.');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showErr('Please enter a valid email address.');
    return;
  }
  fd = { first_name: fn, last_name: ln, email, phone, address: addr, city, zip };
  hideErr();
  setStep(2);
  if (pets.length === 0) addPetForm();
}

function addPetForm() {
  document.getElementById('pet-form').classList.remove('hidden');
  document.getElementById('pet_name').focus();
}

function cancelPet() {
  document.getElementById('pet-form').classList.add('hidden');
  document.getElementById('pet_name').value = '';
  document.getElementById('pet_type').value = '';
  document.getElementById('pet_breed').value = '';
  document.getElementById('pet_age').value = '';
  document.getElementById('pet_gender').value = '';
  document.getElementById('pet_neutered').value = '';
}

function savePet() {
  const name = document.getElementById('pet_name').value.trim();
  const type = document.getElementById('pet_type').value;
  if (!name || !type) {
    showErr('Please enter pet name and type.');
    return;
  }
  pets.push({
    name,
    type,
    breed: document.getElementById('pet_breed').value.trim(),
    age: parseFloat(document.getElementById('pet_age').value) || 0,
    gender: document.getElementById('pet_gender').value,
    neutered: document.getElementById('pet_neutered').value
  });
  renderPets();
  cancelPet();
}

function renderPets() {
  const c = document.getElementById('pets-list');
  c.innerHTML = pets.map((p, i) => `
    <div class="bg-gray-50 rounded-xl p-3 flex items-center justify-between">
      <div class="text-sm">
        <div class="font-semibold text-gray-800">${p.name}</div>
        <div class="text-gray-400 text-xs">${p.type}${p.breed ? ' · ' + p.breed : ''}${p.age ? ' · ' + p.age + 'y' : ''}</div>
      </div>
      <button onclick="removePet(${i})" class="text-red-400 hover:text-red-600 text-xs">
        <i class="fas fa-trash"></i>
      </button>
    </div>`).join('');
}

function removePet(i) {
  pets.splice(i, 1);
  renderPets();
}

function step2Next() {
  hideErr();
  setStep(3);
}

async function submitReg() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || username.length < 3) {
    showErr('Username must be at least 3 characters.');
    return;
  }
  if (!password || password.length < 6) {
    showErr('Password must be at least 6 characters.');
    return;
  }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Creating account...';
  try {
    const r = await fetch(API + '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username,
        password,
        email: fd.email,
        phone: fd.phone,
        invite_code: document.getElementById('invite_code').value.trim() || ''
      })
    });
    const d = await r.json();
    if (d.success && d.data && d.data.user && d.data.user.id > 0) {
      localStorage.setItem('token', d.data.token);
      localStorage.setItem('user', JSON.stringify(d.data.user));
      localStorage.setItem('userProfile', JSON.stringify({
        first_name: fd.first_name,
        last_name: fd.last_name,
        address: fd.address,
        city: fd.city,
        zip: fd.zip,
        pets
      }));
      document.getElementById('step3').classList.add('hidden');
      document.getElementById('success').classList.remove('hidden');
    } else {
      showErr(d.message || 'Registration failed.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-lock mr-1"></i> Complete Registration';
    }
  } catch(e) {
    showErr('Network error.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock mr-1"></i> Complete Registration';
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Plans - PetPaw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .gradient-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .plan-card:hover { transform: translateY(-4px); transition: all 0.3s; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <i class="fas fa-paw text-purple-600 text-xl"></i>
        <span class="font-bold text-gray-800 text-lg">PetPaw</span>
      </a>
      <a href="/profile" class="text-gray-500 hover:text-purple-600"><i class="fas fa-user"></i></a>
    </div>
  </header>

  <!-- Hero -->
  <div class="gradient-purple text-white py-10 px-4 text-center">
    <h1 class="text-3xl font-bold mb-2">Wellness Plans</h1>
    <p class="text-purple-200">Choose a plan that fits your pet's needs</p>
  </div>

  <!-- Plans -->
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div id="plans-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="text-center py-12 col-span-3 text-gray-400">
        <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
        <p>Loading plans...</p>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl">
      <div class="gradient-purple text-white p-5 rounded-t-2xl">
        <h3 class="text-xl font-bold">Complete Your Order</h3>
        <p id="modal-plan-name" class="text-purple-200 text-sm mt-1"></p>
      </div>
      <div class="p-5">
        <!-- Order Summary -->
        <div class="bg-gray-50 rounded-xl p-4 mb-4">
          <div class="flex justify-between mb-2">
            <span class="text-gray-500">Plan</span>
            <span id="modal-plan-title" class="font-semibold"></span>
          </div>
          <div class="flex justify-between mb-2">
            <span class="text-gray-500">Duration</span>
            <span class="font-semibold">1 Year</span>
          </div>
          <div class="flex justify-between border-t pt-2 mt-2">
            <span class="font-bold">Total</span>
            <span id="modal-price" class="font-bold text-purple-600 text-lg"></span>
          </div>
        </div>

        <!-- PayPal Info -->
        <div id="paypal-info" class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4 hidden">
          <p class="text-sm font-semibold text-blue-800 mb-1"><i class="fab fa-paypal mr-1"></i>Pay via PayPal</p>
          <p class="text-sm text-gray-600 mb-2">Send payment to:</p>
          <div class="flex items-center gap-2">
            <input id="paypal-email-show" type="text" readonly class="flex-1 bg-white border rounded-lg px-3 py-2 text-sm font-mono">
            <button onclick="copyPayPal()" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-sm hover:bg-blue-700">Copy</button>
          </div>
          <p class="text-xs text-gray-500 mt-2">After sending payment, click "I've Paid" below</p>
        </div>

        <!-- Payment Buttons -->
        <div class="space-y-3">
          <button id="btn-paypal" onclick="payWithPayPal()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 flex items-center justify-center gap-2">
            <i class="fab fa-paypal"></i> Pay with PayPal
          </button>
          <button id="btn-paid" onclick="confirmPaid()" class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold hover:bg-green-700 hidden">
            <i class="fas fa-check mr-2"></i>I've Paid - Confirm Enrollment
          </button>
          <button onclick="closeModal()" class="w-full bg-gray-100 text-gray-600 py-3 rounded-xl font-semibold hover:bg-gray-200">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="success-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl text-center p-8">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-check text-green-600 text-2xl"></i>
      </div>
      <h3 class="text-xl font-bold text-gray-800 mb-2">Enrollment Successful!</h3>
      <p id="success-msg" class="text-gray-500 mb-6"></p>
      <a href="/profile" class="block w-full bg-purple-600 text-white py-3 rounded-xl font-semibold hover:bg-purple-700">View My Plans</a>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    let selectedPlan = null;
    let paypalEmail = '';

    // Load plans
    async function loadPlans() {
      try {
        const res = await fetch('/api/vet/wellness-plans');
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        const plans = data.data;
        if (!plans.length) {
          document.getElementById('plans-container').innerHTML = '<p class="text-center text-gray-400 col-span-3 py-12">No plans available</p>';
          return;
        }

        const colors = ['from-purple-500 to-indigo-600', 'from-sky-500 to-blue-600', 'from-emerald-500 to-teal-600'];
        document.getElementById('plans-container').innerHTML = plans.map((p, i) => {
          let features = [];
          try { features = typeof p.features === 'string' ? JSON.parse(p.features) : p.features; } catch(e) {}
          return `
            <div class="plan-card bg-white rounded-2xl shadow-lg overflow-hidden cursor-pointer border-2 border-transparent hover:border-purple-400" onclick="selectPlan(${JSON.stringify(p).replace(/"/g, '&quot;')})">
              <div class="bg-gradient-to-br ${colors[i % colors.length]} p-6 text-white text-center">
                <h3 class="text-xl font-bold mb-1">${p.name}</h3>
                <div class="text-3xl font-bold mt-2">$${parseFloat(p.price).toFixed(2)}<span class="text-sm font-normal">/yr</span></div>
                ${p.reimbursement_amount ? `<div class="text-sm mt-1 opacity-90">Up to $${p.reimbursement_amount} reimbursement</div>` : ''}
              </div>
              <div class="p-5">
                ${p.description ? `<p class="text-gray-500 text-sm mb-4">${p.description}</p>` : ''}
                <ul class="space-y-2 mb-5">
                  ${features.map(f => `<li class="flex items-start gap-2 text-sm text-gray-600"><i class="fas fa-check-circle text-green-500 mt-0.5 flex-shrink-0"></i>${f}</li>`).join('')}
                </ul>
                <button class="w-full gradient-purple text-white py-3 rounded-xl font-semibold hover:opacity-90">
                  Select Plan
                </button>
              </div>
            </div>`;
        }).join('');
      } catch(e) {
        document.getElementById('plans-container').innerHTML = `<p class="text-center text-red-400 col-span-3 py-12">Error: ${e.message}</p>`;
      }
    }

    // Load PayPal email
    async function loadPayPalEmail() {
      try {
        const res = await fetch('/api/vet/settings/paypal');
        const data = await res.json();
        paypalEmail = data.paypal_email || '';
        console.log('PayPal email loaded:', paypalEmail);
      } catch(e) {
        console.error('Failed to load PayPal email:', e);
      }
    }

    function selectPlan(plan) {
      if (!token) { window.location.href = '/login'; return; }
      selectedPlan = plan;
      document.getElementById('modal-plan-name').textContent = plan.name;
      document.getElementById('modal-plan-title').textContent = plan.name;
      document.getElementById('modal-price').textContent = '$' + parseFloat(plan.price).toFixed(2);
      document.getElementById('paypal-info').classList.add('hidden');
      document.getElementById('btn-paid').classList.add('hidden');
      document.getElementById('btn-paypal').classList.remove('hidden');
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    function copyPayPal() {
      const input = document.getElementById('paypal-email-show');
      input.select();
      document.execCommand('copy');
      alert('PayPal email copied!');
    }

    function payWithPayPal() {
      if (!paypalEmail) {
        // Try to reload
        loadPayPalEmail().then(() => {
          if (!paypalEmail) {
            alert('PayPal not configured. Please contact support.');
          } else {
            document.getElementById('paypal-email-show').value = paypalEmail;
            document.getElementById('paypal-info').classList.remove('hidden');
            document.getElementById('btn-paypal').classList.add('hidden');
            document.getElementById('btn-paid').classList.remove('hidden');
          }
        });
        return;
      }
      document.getElementById('paypal-email-show').value = paypalEmail;
      document.getElementById('paypal-info').classList.remove('hidden');
      document.getElementById('btn-paypal').classList.add('hidden');
      document.getElementById('btn-paid').classList.remove('hidden');
    }

    async function confirmPaid() {
      const btn = document.getElementById('btn-paid');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Processing...';

      try {
        const res = await fetch('/api/vet/enroll-wellness', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan_id: selectedPlan.id, payment_method: 'paypal' })
        });
        const data = await res.json();

        if (data.success) {
          closeModal();
          document.getElementById('success-msg').textContent = 'You are now enrolled in ' + selectedPlan.name + '!';
          document.getElementById('success-modal').classList.remove('hidden');
        } else {
          alert('Error: ' + data.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check mr-2"></i>I\'ve Paid - Confirm Enrollment';
        }
      } catch(e) {
        alert('Error: ' + e.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check mr-2"></i>I\'ve Paid - Confirm Enrollment';
      }
    }

    loadPlans();
    loadPayPalEmail();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - PetPaw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0ea5e9',secondary:'#10b981'}}}}</script>
  <style>.gradient-bg{background:linear-gradient(135deg,#0ea5e9 0%,#10b981 100%);}</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a href="/" class="flex items-center space-x-2">
          <div class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center">
            <i class="fas fa-paw text-white text-xl"></i>
          </div>
          <span class="text-2xl font-bold bg-gradient-to-r from-sky-500 to-emerald-500 bg-clip-text text-transparent">PetPaw</span>
        </a>
        <div class="flex items-center gap-4">
          <a href="/profile" class="text-sky-500 font-medium">Profile</a>
          <button onclick="logout()" class="text-red-400 hover:text-red-500 text-sm">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
      <div class="flex items-center gap-6">
        <div class="w-20 h-20 gradient-bg rounded-full flex items-center justify-center text-white text-3xl font-bold" id="user-avatar">U</div>
        <div class="flex-1">
          <h2 class="text-2xl font-bold" id="user-name">Loading...</h2>
          <p class="text-gray-500" id="user-phone">-</p>
          <p class="text-gray-500 text-sm" id="user-email">-</p>
        </div>
        <div class="text-right">
          <div class="text-gray-500 text-sm mb-1">Account Balance</div>
          <div class="text-3xl font-bold text-sky-500" id="user-balance">$0.00</div>
        </div>
      </div>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <a href="/orders" class="bg-white rounded-2xl shadow-lg p-6 text-center hover:shadow-xl transition">
        <div class="w-14 h-14 gradient-bg rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fas fa-box text-white text-xl"></i>
        </div>
        <span class="font-semibold text-gray-900">My Orders</span>
      </a>
      <a href="/cart" class="bg-white rounded-2xl shadow-lg p-6 text-center hover:shadow-xl transition">
        <div class="w-14 h-14 gradient-bg rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fas fa-shopping-cart text-white text-xl"></i>
        </div>
        <span class="font-semibold text-gray-900">Shopping Cart</span>
      </a>
      <a href="/upload" class="bg-white rounded-2xl shadow-lg p-6 text-center hover:shadow-xl transition">
        <div class="w-14 h-14 gradient-bg rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fas fa-cloud-upload-alt text-white text-xl"></i>
        </div>
        <span class="font-semibold text-gray-900">Upload Files</span>
      </a>
      <a href="/team" class="bg-white rounded-2xl shadow-lg p-6 text-center hover:shadow-xl transition">
        <div class="w-14 h-14 gradient-bg rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fas fa-users text-white text-xl"></i>
        </div>
        <span class="font-semibold text-gray-900">My Team</span>
      </a>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6">
      <h3 class="text-lg font-bold mb-4">Balance History</h3>
      <div id="balance-logs" class="space-y-3">
        <p class="text-center text-gray-400 py-8">Loading...</p>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    async function loadProfile() {
      try {
        const res = await fetch('/api/auth/profile', { headers: getAuthHeaders() });
        const data = await res.json();
        if (!data.success) return;

        const user = data.data;
        document.getElementById('user-avatar').textContent = (user.username || 'U')[0].toUpperCase();
        document.getElementById('user-name').textContent = user.username;
        document.getElementById('user-phone').textContent = user.phone || 'No phone';
        document.getElementById('user-email').textContent = user.email || 'No email';
        document.getElementById('user-balance').textContent = '$' + (user.balance || 0).toFixed(2);
      } catch (e) {
        console.error(e);
      }
    }

    async function loadBalanceLogs() {
      try {
        const res = await fetch('/api/auth/balance-logs?limit=10', { headers: getAuthHeaders() });
        const data = await res.json();
        if (!data.success) return;

        const container = document.getElementById('balance-logs');
        if (data.data.length === 0) {
          container.innerHTML = '<p class="text-center text-gray-400 py-8">No records yet</p>';
          return;
        }

        container.innerHTML = data.data.map(log => `
          <div class="flex items-center justify-between py-3 border-b last:border-b-0">
            <div>
              <div class="font-medium">${log.reason || 'Balance change'}</div>
              <div class="text-sm text-gray-500">${formatDateTime(log.created_at)}</div>
            </div>
            <div class="font-bold ${log.type === 'add' || log.type === 'refund' ? 'text-green-500' : 'text-red-500'}">
              ${log.type === 'add' || log.type === 'refund' ? '+' : '-'}$${log.amount.toFixed(2)}
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!requireLogin()) return;
      loadProfile();
      loadBalanceLogs();
    });
  </script>
</body>
</html>

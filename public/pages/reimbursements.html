<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reimbursements - PetPaw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0ea5e9',secondary:'#10b981'}}}}</script>
  <style>.gradient-bg{background:linear-gradient(135deg,#0ea5e9 0%,#10b981 100%);}</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a href="/" class="flex items-center space-x-2">
          <div class="w-10 h-10 gradient-bg rounded-full flex items-center justify-center"><i class="fas fa-paw text-white text-xl"></i></div>
          <span class="text-2xl font-bold bg-gradient-to-r from-sky-500 to-emerald-500 bg-clip-text text-transparent">PetPaw</span>
        </a>
        <div class="hidden md:flex items-center space-x-8">
          <a href="/" class="text-gray-600 hover:text-sky-500">Home</a>
          <a href="/vet-discount" class="text-gray-600 hover:text-sky-500">Vet Discount</a>
          <a href="/wellness" class="text-gray-600 hover:text-sky-500">Wellness</a>
          <a href="/shop" class="text-gray-600 hover:text-sky-500">Shop</a>
          <a href="/blog" class="text-gray-600 hover:text-sky-500">Blog</a>
        </div>
        <div class="flex items-center space-x-4" id="nav-auth"></div>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900"><i class="fas fa-file-invoice-dollar text-primary mr-2"></i>My Reimbursements</h1>
      <button onclick="showClaimModal()" class="gradient-bg text-white px-6 py-3 rounded-full font-semibold hover:opacity-90 transition">
        <i class="fas fa-plus mr-2"></i>Submit Claim
      </button>
    </div>

    <!-- Vet Transactions -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <h2 class="text-xl font-bold mb-4"><i class="fas fa-stethoscope text-sky-500 mr-2"></i>Vet Discount Usage</h2>
      <div id="vet-trans-list">
        <div class="text-center text-gray-400 py-8">Loading...</div>
      </div>
    </div>

    <!-- Wellness Claims -->
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold mb-4"><i class="fas fa-heartbeat text-indigo-500 mr-2"></i>Wellness Reimbursement Claims</h2>
      <div id="claims-list">
        <div class="text-center text-gray-400 py-8">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Submit Claim Modal -->
  <div id="claimModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg mx-4">
      <h3 class="text-xl font-bold mb-4"><i class="fas fa-file-medical text-primary mr-2"></i>Submit Wellness Claim</h3>
      <form id="claimForm" onsubmit="submitClaim(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Claim Amount ($) *</label>
            <input type="number" step="0.01" id="claim-amount" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Service Date *</label>
            <input type="date" id="claim-date" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Veterinarian Name</label>
            <input type="text" id="claim-vet" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary" placeholder="e.g. Dr. Smith at City Vet">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
            <textarea id="claim-desc" rows="3" required class="w-full px-4 py-2 border rounded-lg" placeholder="Annual checkup, vaccination, dental cleaning, etc."></textarea>
          </div>
        </div>
        <div class="flex space-x-3 mt-6">
          <button type="submit" class="flex-1 gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90">Submit Claim</button>
          <button type="button" onclick="closeClaimModal()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    const token = localStorage.getItem('token');
    let myEnrollments = [];

    document.addEventListener('DOMContentLoaded', () => {
      checkLoginStatus();
      if (token) { loadEnrollments(); loadVetTrans(); loadClaims(); }
      else { window.location.href = '/login'; }
    });

    async function loadEnrollments() {
      try {
        const res = await fetch('/api/vet/my-enrollments', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        myEnrollments = (data.data || {}).wellness || [];
      } catch (e) {}
    }

    async function loadVetTrans() {
      try {
        const res = await fetch('/api/vet/vet-transactions', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        const list = data.data || [];
        const container = document.getElementById('vet-trans-list');
        if (list.length === 0) { container.innerHTML = '<div class="text-center text-gray-400 py-6">No discount transactions yet.</div>'; return; }
        container.innerHTML = '<table class="w-full text-sm"><thead><tr class="text-left text-gray-500 border-b"><th class="pb-2">Date</th><th class="pb-2">Service</th><th class="pb-2">Original</th><th class="pb-2">Discount</th><th class="pb-2">You Pay</th></tr></thead><tbody>' + list.map(t => '<tr class="border-b"><td class="py-2">'+new Date(t.transaction_date).toLocaleDateString()+'</td><td class="py-2">'+(t.service_type||'-')+'</td><td class="py-2 text-gray-400">$'+parseFloat(t.original_amount).toFixed(2)+'</td><td class="py-2 text-green-600 font-medium">-$'+parseFloat(t.discount_amount).toFixed(2)+'</td><td class="py-2 font-medium">$'+parseFloat(t.final_amount).toFixed(2)+'</td></tr>').join('') + '</tbody></table>';
      } catch (e) { document.getElementById('vet-trans-list').innerHTML = '<div class="text-center text-red-400 py-6">Failed to load</div>'; }
    }

    async function loadClaims() {
      try {
        const res = await fetch('/api/vet/reimbursements', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        const list = data.data || [];
        const container = document.getElementById('claims-list');
        if (list.length === 0) { container.innerHTML = '<div class="text-center text-gray-400 py-6">No claims submitted yet.</div>'; return; }
        container.innerHTML = '<table class="w-full text-sm"><thead><tr class="text-left text-gray-500 border-b"><th class="pb-2">Submitted</th><th class="pb-2">Service</th><th class="pb-2">Amount</th><th class="pb-2">Reimbursement</th><th class="pb-2">Status</th></tr></thead><tbody>' + list.map(c => '<tr class="border-b"><td class="py-2">'+new Date(c.created_at).toLocaleDateString()+'</td><td class="py-2">'+(c.description||'-')+'</td><td class="py-2">$'+parseFloat(c.claim_amount).toFixed(2)+'</td><td class="py-2 text-indigo-600 font-medium">$'+(c.status==="approved"?parseFloat(c.reimbursement_amount).toFixed(2):'...')+'</td><td class="py-2"><span class="px-2 py-1 rounded text-xs font-medium '+ (c.status==="approved"?"bg-green-100 text-green-700":c.status==="rejected"?"bg-red-100 text-red-700":"bg-yellow-100 text-yellow-700") +'">'+c.status+'</span></td></tr>').join('') + '</tbody></table>';
      } catch (e) { document.getElementById('claims-list').innerHTML = '<div class="text-center text-red-400 py-6">Failed to load</div>'; }
    }

    function showClaimModal() {
      if (myEnrollments.length === 0) { alert('You need an active Wellness plan to submit claims.'); return; }
      document.getElementById('claimModal').classList.remove('hidden');
    }

    function closeClaimModal() { document.getElementById('claimModal').classList.add('hidden'); }

    async function submitClaim(e) {
      e.preventDefault();
      const active = myEnrollments.find(en => en.status === 'active');
      if (!active) { alert('No active Wellness enrollment found.'); return; }
      const data = {
        enrollment_id: active.id,
        claim_amount: parseFloat(document.getElementById('claim-amount').value),
        vet_name: document.getElementById('claim-vet').value,
        service_date: document.getElementById('claim-date').value,
        description: document.getElementById('claim-desc').value
      };
      try {
        const res = await fetch('/api/vet/reimbursement', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) { alert('Claim submitted! Amount: $' + result.data.reimbursement_amount.toFixed(2)); closeClaimModal(); loadClaims(); }
        else alert(result.message || 'Failed');
      } catch (e) { alert('Failed to submit claim'); }
    }
  </script>
</body>
</html>

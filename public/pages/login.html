<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PetPaw</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{primary:'#0ea5e9',secondary:'#10b981'},fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    body{font-family:'Inter',sans-serif}
    .gradient-bg{background:linear-gradient(135deg,#0ea5e9 0%,#10b981 100%)}
    .gradient-text{background:linear-gradient(135deg,#0ea5e9,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <nav class="bg-white border-b border-gray-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <div class="w-9 h-9 gradient-bg rounded-lg flex items-center justify-center"><i class="fas fa-paw text-white"></i></div>
        <span class="text-xl font-bold gradient-text">PetPaw</span>
      </a>
      <a href="/register" class="text-gray-500 text-sm hover:text-sky-500">New member? Register</a>
    </div>
  </nav>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-16 h-16 gradient-bg rounded-2xl flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-paw text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Welcome back</h1>
        <p class="text-gray-400 text-sm mt-1">Sign in to your PetPaw account</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
        <div id="err" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-3 mb-4 text-sm flex items-center gap-2">
          <i class="fas fa-exclamation-circle"></i><span id="err-text"></span>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Username or Email</label>
            <input type="text" id="account" placeholder="Enter username or email"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
              onkeyup="if(event.key==='Enter')login()">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Password</label>
            <div class="relative">
              <input type="password" id="password" placeholder="Your password"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 pr-10"
                onkeyup="if(event.key==='Enter')login()">
              <button onclick="togglePw()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                <i class="fas fa-eye text-sm" id="pw-icon"></i>
              </button>
            </div>
          </div>
        </div>

        <button onclick="login()" id="login-btn"
          class="w-full gradient-bg text-white py-3 rounded-xl font-semibold mt-6 hover:opacity-90 transition">
          Sign In
        </button>

        <div class="mt-4 text-center text-sm text-gray-400">
          Don't have an account?
          <a href="/register" class="text-sky-500 font-medium hover:underline">Register now</a>
        </div>
      </div>

      <!-- Admin hint -->
      <div class="mt-4 text-center text-xs text-gray-400">
        Admin? <a href="/admin" class="text-gray-500 hover:text-sky-500">Go to admin panel</a>
      </div>
    </div>
  </div>

<script>
const API = 'https://pet365-store.onrender.com';

function togglePw() {
  const pw = document.getElementById('password');
  const icon = document.getElementById('pw-icon');
  if (pw.type === 'password') {
    pw.type = 'text';
    icon.className = 'fas fa-eye-slash text-sm';
  } else {
    pw.type = 'password';
    icon.className = 'fas fa-eye text-sm';
  }
}

async function login() {
  const account = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;
  if (!account || !password) {
    document.getElementById('err').classList.remove('hidden');
    document.getElementById('err-text').textContent = 'Please enter username and password.';
    return;
  }
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Signing in...';
  document.getElementById('err').classList.add('hidden');
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account, password })
    });
    const d = await r.json();
    if (d.success) {
      localStorage.setItem('token', d.data.token);
      localStorage.setItem('user', JSON.stringify(d.data.user));
      const redirect = new URLSearchParams(location.search).get('redirect') || '/profile';
      location.href = redirect;
    } else {
      document.getElementById('err').classList.remove('hidden');
      document.getElementById('err-text').textContent = d.message || 'Invalid username or password.';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch(e) {
    document.getElementById('err').classList.remove('hidden');
    document.getElementById('err-text').textContent = 'Network error. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

// Already logged in?
if (localStorage.getItem('token')) {
  location.href = '/profile';
}
</script>
</body>
</html>

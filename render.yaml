# render.yaml - Render Blueprint
# Deploy this service on Render

services:
  - type: web
    name: petpaw
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "10"

disks:
  - name: data
    mountPath: /data
    sizeGB: 1
